<head>

    <style>
        /* 全体：白を基調としたシンプルなスタイル */
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            text-align: center;
            padding: 0;
            background: #f4f7f6;
            color: #333;
            margin: 0;
        }

        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            background: #fff; 
            padding: 20px; 
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* ヘッダー */
        .sticky-header { 
            position: sticky; 
            top: 0; 
            background: rgba(255, 255, 255, 0.97); 
            padding: 20px 0; 
            z-index: 100; 
            border-bottom: 1px solid #ddd; 
            margin-bottom: 25px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        h2 { 
            margin: 0 0 15px 0; 
            color: #2c3e50; 
            font-size: 1.8em;
        }

        /* ゲージ */
        .limit-gauge-outer {
            max-width: 600px;
            margin: 10px auto;
            padding: 4px;
            background: #eee; 
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .limit-gauge-bg {
            flex-grow: 1;
            height: 12px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        #limitFill {
            height: 100%;
            width: 0%;
            background: #4caf50;
            transition: width 0.4s ease-out;
        }

        .limit-label {
            font-size: 14px;
            font-weight: bold;
            color: #666;
            min-width: 40px;
        }

        .status { margin: 10px 0; font-size: 1.1em; color: #666; font-weight: bold; }
        #message { height: 24px; font-weight: bold; margin-bottom: 10px; font-size: 1em; }

        input { 
            font-size: 18px; 
            padding: 10px 15px; 
            width: 60%; 
            max-width: 400px;
            border: 2px solid #ddd; 
            border-radius: 5px;
            background: #fff; 
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
        }
        input:focus { border-color: #2196f3; }

        .btn { 
            padding: 10px 20px; 
            font-size: 14px; 
            cursor: pointer; 
            border: none;
            border-radius: 5px;
            background: #666; 
            color: #fff; 
            font-weight: bold;
            margin: 5px;
        }
        .btn:hover { opacity: 0.9; }
        .giveup-btn { background: #e53935; }
        .retry-btn { background: #1e88e5; }

        /* リスト表示：横に最大5個ぴったり並ぶように固定 */
        .list { 
            display: grid; 
            grid-template-columns: repeat(5, minmax(0, 1fr)); 
            gap: 12px; 
            margin-top: 30px; 
        }

        /* 画面幅が狭いときは崩れないようレスポンシブ対応 */
        @media (max-width: 1200px) {
            .list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        }
        @media (max-width: 900px) {
            .list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 500px) {
            .list { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        }

        .item { 
            padding: 15px 10px; 
            background: #fafafa;
            border: 1px solid #eef0f2;
            border-radius: 8px;
            color: #bbb; 
            transition: all 0.3s ease;
            word-break: break-all;
        }

        .hint-text { font-size: 0.8em; font-weight: bold; margin-bottom: 5px; }
        .answer-text { font-size: 0.95em; font-weight: bold; margin-top: 5px; }
        
        .item.missed { background: #ffebee !important; border-color: #ef9a9a !important; color: #ef5350 !important; box-shadow: none !important; }
        .item.missed .answer-text { text-decoration: line-through; }
        .item.missed .hint-text { color: #e53935 !important; }

           ハード別デザインスタイル（正解時）
           ========================================================================== */

        /* FC (ファミコン) */
        .fc-card.found { background: #8b1d1d !important; color: #fff !important; border: 2px solid #d4af37 !important; }
        .fc-card .hint-text { color: #8b1d1d; }
        .fc-card.found .hint-text { color: #ffeb3b; }

        /* SFC (スーパーファミコン) */
        .sfc-card.found {
            background: #d1d5db !important; color: #333 !important; border: 2px solid #4b5563 !important;

        .sfc-card .hint-text { color: #4b5563; }
        .sfc-card.found .hint-text { color: #555; }

        .n64-card.found { background: #2c3e50 !important; color: #fff !important; border: 2px solid #34495e !important; box-shadow: inset 6px 0 0 #e74c3c, inset 12px 0 0 #3498db, inset 18px 0 0 #f1c40f, inset 24px 0 0 #2ecc71; padding-left: 20px; }

        .n64-card.found .hint-text { color: #bdc3c7; }

        .wii-card.found .hint-text { color: #00a0e9; }

        .sw-card.found { background: #101010 !important; color: #fff !important; border: 2px solid #323232 !important; box-shadow: inset 6px 0 0 #ff3c50, inset -6px 0 0 #00b4d2; }

        .sw-card.found .hint-text { color: #00b4d2; }

        /* Switch 2 */
        .sw2-card.found { background: linear-gradient(135deg, #1a1a1a, #2d3436) !important; color: #fff !important; border: 2px solid #dcdde1 !important; box-shadow: inset 6px 0 0 #e63946, inset -6px 0 0 #457b9d; }
        .sw2-card .hint-text { color: #e63946; }
        .sw2-card.found .hint-text { color: #a8dadc; }

        /* GB */
        .gb-card.found { background: #8bac0f !important; color: #0f380f !important; border: 2px solid #306230 !important; }
        .gb-card .hint-text { color: #306230; }
        .gb-card.found .hint-text { color: #0f380f; }

        /* GBA */
        .gba-card.found { background: #583ca3 !important; color: #fff !important; border: 2px solid #e67e22 !important; }
        .gba-card .hint-text { color: #583ca3; }
        .gba-card.found .hint-text { color: #f39c12; }

        /* DS */
        .ds-card.found { background: #34495e !important; color: #fff !important; border: 2px solid #7f8c8d !important; border-top: 4px solid #bdc3c7 !important; border-bottom: 4px solid #bdc3c7 !important; }
        .ds-card .hint-text { color: #7f8c8d; }
        .ds-card.found .hint-text { color: #bdc3c7; }

        .tds-card.found { background: #d32f2f !important; color: #fff !important; border: 2px solid #f44336 !important; box-shadow: inset 0 4px 0 rgba(255,255,255,0.3); }

let foundCount = 0;
let isGameOver = false;
let isProcessing = false; // 連鎖演出中の連続入力を防ぐフラグ
let answeredIndices = new Set();

const input = document.getElementById('answerInput');
const remainingText = document.getElementById('remaining');
const totalText = document.getElementById('total');
const listContainer = document.getElementById('answerList');
const messageEl = document.getElementById('message');
const giveupBtn = document.getElementById('giveupBtn');
const retryBtn = document.getElementById('retryBtn');
const limitFill = document.getElementById('limitFill');
const label = document.getElementById('progressPercent');

function getHardClass(hint) {
    if (hint.includes("スーパーファミコン")) return "sfc-card";
    if (hint.includes("ファミコン")) return "fc-card";
    if (hint.includes("ニンテンドー64")) return "n64-card";
    if (hint.includes("ゲームキューブ")) return "gc-card";
    if (hint.includes("Wii")) return "wii-card";
    if (hint.includes("Switch2")) return "sw2-card";
    if (hint.includes("Switch")) return "sw-card";
    if (hint.includes("ゲームボーイアドバンス")) return "gba-card";
    if (hint.includes("ゲームボーイ")) return "gb-card";
    if (hint.includes("3DS")) return "tds-card";
    if (hint.includes("DS")) return "ds-card";
    if (hint.includes("プレイステーション5")) return "ps5-card";
    if (hint.includes("プレイステーション4")) return "ps4-card";
    if (hint.includes("プレイステーション3")) return "ps3-card";
    if (hint.includes("プレイステーション2")) return "ps2-card";
    if (hint.includes("プレイステーション")) return "ps1-card";
    return "";
}

function updateLimitGauge() {
    const percent = Math.floor((foundCount / quizData.length) * 100);
    if (limitFill) limitFill.style.width = percent + "%";
    if (label) label.textContent = percent + "%";
}

function init() {
    foundCount = 0;
    isGameOver = false;
    isProcessing = false;
    answeredIndices.clear();
    listContainer.innerHTML = '';
    input.disabled = false;
    input.value = '';
    input.placeholder = config.placeholderNormal;
    giveupBtn.style.display = 'inline-block';
    retryBtn.style.display = 'none';
    remainingText.textContent = quizData.length;
    totalText.textContent = quizData.length;
    messageEl.textContent = '';

    quizData.forEach((item, index) => {
        const div = document.createElement('div');
        let hardClass = getHardClass(item.hint);
        div.className = `item ${hardClass}`;
        div.id = 'target-' + index;
        div.innerHTML = `<div class="hint-text">${item.hint}</div><div class="answer-text">？？？？</div>`;
        listContainer.appendChild(div);
    });

    loadProgress();
    updateLimitGauge();
}

function loadProgress() {
    const savedData = localStorage.getItem(config.storageKey);
    if (savedData) {
        const savedIndices = JSON.parse(savedData);
        savedIndices.forEach(index => {
            if (index < quizData.length) {
                answeredIndices.add(index);
                updateItemDisplay(index, true);
                foundCount++;
            }
        });
        remainingText.textContent = quizData.length - foundCount;
        if (foundCount > 0) showMessage("前回の続きから復元しました！", "#34495e");
    }
}

function saveProgress() {
    localStorage.setItem(config.storageKey, JSON.stringify(Array.from(answeredIndices)));
}

// 指定したミリ秒だけ待機するヘルパー関数
const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

// === 1秒かけて滑らかにスクロールするカスタム関数 ===
function customSmoothScroll(target, duration = 1000) {
    const targetY = target instanceof HTMLElement 
        ? window.scrollY + target.getBoundingClientRect().top - (window.innerHeight / 2) + (target.offsetHeight / 2)
        : target;
    const startY = window.scrollY;
    const distance = targetY - startY;
    let startTime = null;

    function animation(currentTime) {
        if (!startTime) startTime = currentTime;
        const timeElapsed = currentTime - startTime;
        const progress = Math.min(timeElapsed / duration, 1);
        
        // 滑らかなイージング (easeInOutQuad)
        const ease = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;
        window.scrollTo(0, startY + distance * ease);

        if (timeElapsed < duration) {
            requestAnimationFrame(animation);
        }
    }
    requestAnimationFrame(animation);
}

input.addEventListener('keypress', async (e) => {
    if (e.key === 'Enter' && !isGameOver && !isProcessing) {
        const val = input.value.trim().toLowerCase();
        if (val === "") return;
        
        let targetIndices = [];
        quizData.forEach((item, index) => {
            if (item.accept.some(a => a.toLowerCase() === val)) {
                targetIndices.push(index);
            }
        });

        if (targetIndices.length > 0) {
            let newlyFoundIndices = [];
            let alreadyAnswered = true;

            // 未解答のインデックスを抽出
            targetIndices.forEach(idx => {
                if (!answeredIndices.has(idx)) {
                    newlyFoundIndices.push(idx);
                    alreadyAnswered = false;
                }
            });

            if (newlyFoundIndices.length > 0) {
                isProcessing = true; // 連鎖開示が完了するまで入力をガード
                input.value = '';
                input.placeholder = "開示中...";

                // 未解答だったものを1つずつ時間差で開いていく
                for (let i = 0; i < newlyFoundIndices.length; i++) {
                    const idx = newlyFoundIndices[i];
                    
                    answeredIndices.add(idx);
                    updateItemDisplay(idx, true);
                    foundCount++;

                    remainingText.textContent = quizData.length - foundCount;
                    showMessage("正解！", "#4caf50");
                    updateLimitGauge();

                    // 【修正点】ブラウザ標準の追従を廃止し、自作の1秒カスタムスクロールに変更！
                    const currentTargetEl = document.getElementById('target-' + idx);
                    if (currentTargetEl) {
                        customSmoothScroll(currentTargetEl, 1000);
                    }

                    // 1秒かけて次の開示・スクロールへ進む（テンポをゆっくりに同期）
                    if (i < newlyFoundIndices.length - 1) {
                        await sleep(1000);
                    }
                }

                saveProgress();
                isProcessing = false;
                input.placeholder = config.placeholderNormal;
                input.focus();

                if (foundCount === quizData.length) finishGame("全問正解！神レベルの知識量です！おめでとう！", "#4caf50");
            } else if (alreadyAnswered) {
                showMessage("既に入力されています", "#777");
                // 既に入力されている時の追尾も1秒かけてじわっと移動
                const existTargetEl = document.getElementById('target-' + targetIndices[0]);
                if (existTargetEl) {
                    customSmoothScroll(existTargetEl, 1000);
                }
                input.value = '';
            }
        } else {
            showMessage("違います", "#f44336");
            input.value = '';
        }
    }
});

function updateItemDisplay(index, isCorrect) {
    const targetEl = document.getElementById('target-' + index);
    const data = quizData[index];
    targetEl.innerHTML = `
        <div class="hint-text">${data.hint}</div>
        <div class="answer-text">${data.display}</div>
    `;
    if (isCorrect) {
        targetEl.classList.add('found');
    } else {
        targetEl.classList.add('missed');
    }
}

giveupBtn.addEventListener('click', () => {
    if (isProcessing) return;
    quizData.forEach((item, index) => { if (!answeredIndices.has(index)) updateItemDisplay(index, false); });
    finishGame("ギブアップ！", "#f44336");
});

retryBtn.addEventListener('click', () => {
    if(confirm("全ての解答記録を消去して、最初からやり直しますか？")) { 
        localStorage.removeItem(config.storageKey);
        init(); 
    }
});

function finishGame(msg, color) {
    isGameOver = true;
    input.disabled = true;
    input.placeholder = config.placeholderGameOver;
    giveupBtn.style.display = 'none';
    retryBtn.style.display = 'inline-block';
    showMessage(msg, color);
}

function showMessage(text, color) {
    messageEl.textContent = text;
    messageEl.style.color = color;
    if (!isGameOver) setTimeout(() => { if (messageEl.textContent === text) messageEl.textContent = ""; }, 1500);
}

init();
</script>
