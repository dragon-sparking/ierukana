<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Slay the Spire 2: Card Quiz</title>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --panel-bg: rgba(25, 25, 25, 0.95);
            --border-gold: #8c7851;
            --color-ironclad: #9b2218;
            --color-silent: #2e5d32;
            --color-defect: #1c4d6d;
            --color-watcher: #6a2c70;
            --color-common: #444444;
            --text-main: #e0e0e0;
            --rarity-starter: #ffffff;
            --rarity-common: #ffffff;
            --rarity-uncommon: #00ffff;
            --rarity-rare: #ffd700;
            --rarity-ancient: #ff4444;
        }

        body {
            font-family: 'Hiragino Mincho ProN', 'serif';
            text-align: center;
            background: radial-gradient(circle at center, #222 0%, #000 100%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            background: var(--panel-bg);
            border: 2px solid var(--border-gold);
            box-shadow: 0 0 30px rgba(0,0,0,1);
            padding: 20px;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            background: rgba(15, 15, 15, 0.98);
            padding: 20px 0;
            z-index: 100;
            border-bottom: 2px solid var(--border-gold);
            margin-bottom: 20px;
            backdrop-filter: blur(8px);
        }

        h2 { margin: 0 0 10px 0; letter-spacing: 4px; color: #fff; text-shadow: 0 0 10px var(--border-gold); }

        .limit-gauge-outer {
            max-width: 600px;
            margin: 10px auto;
            background: #000;
            border: 1px solid var(--border-gold);
            padding: 2px;
            position: relative;
        }

        .limit-gauge-bg { height: 14px; background: #111; overflow: hidden; }

        #limitFill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #444, var(--border-gold), #fff);
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
            transition: width 0.5s ease;
        }

        .limit-label { font-family: monospace; color: var(--border-gold); font-size: 1.1em; margin-bottom: 5px; font-weight: bold; }
        .status { margin: 10px 0; font-size: 1em; letter-spacing: 2px; color: #aaa; }
        #message { height: 24px; font-weight: bold; margin-bottom: 10px; }

        input {
            font-size: 18px; padding: 12px; width: 350px;
            border: 1px solid var(--border-gold);
            background: #000; color: #fff; outline: none; text-align: center;
        }

        .btn {
            padding: 12px 24px; font-size: 14px; cursor: pointer;
            border: 1px solid var(--border-gold);
            background: #1a1a1a; color: var(--border-gold);
            font-weight: bold; transition: 0.2s; margin-left: 10px;
        }

        .btn:hover { background: var(--border-gold); color: #000; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px; padding: 20px;
        }

        .item {
            position: relative; aspect-ratio: 3/4; background: #111; border: 1px solid #333;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px; transition: all 0.4s ease; overflow: hidden;
        }

        /* コスト表示コンテナ */
        .cost-container {
            position: absolute; top: 5px; left: 5px;
            display: none; align-items: center; gap: 4px; z-index: 2;
        }
        .show-hints .cost-container { display: flex; }

        /* 通常コスト(円) */
        .cost-main {
            width: 28px; height: 28px;
            background: radial-gradient(circle, #444, #111);
            border: 1px solid var(--border-gold);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #fff; font-size: 0.9em;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        /* 追加コスト(ひし形) */
        .cost-extra {
            width: 24px; height: 24px;
            background: linear-gradient(135deg, #2c3e50, #000);
            border: 1px solid #00e5ff;
            transform: rotate(45deg);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        }
        .cost-extra span {
            transform: rotate(-45deg);
            color: #00e5ff; font-weight: bold; font-size: 0.8em;
        }

        .hint-text { font-size: 0.9em; margin-bottom: 8px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        .hint-starter, .hint-コモン { color: var(--rarity-common) !important; }
        .hint-アンコ { color: var(--rarity-uncommon) !important; }
        .hint-レア { color: var(--rarity-rare) !important; }
        .hint-エンシェント { color: var(--rarity-ancient) !important; }

        .answer-text { font-size: 1.1em; font-weight: bold; color: #444; transition: color 0.3s; }
        .item.found, .item.missed { transform: translateY(-3px); border-width: 2px; opacity: 1 !important; }
        .item.found .answer-text { color: #fff; text-shadow: 0 0 5px #fff; }

        .cls-ironclad.found { border-color: #ff4d00; background: linear-gradient(180deg, #4a0a0a, #111); box-shadow: 0 0 15px var(--color-ironclad); }
        .cls-silent.found   { border-color: #7fff00; background: linear-gradient(180deg, #0a3a0a, #111); box-shadow: 0 0 15px var(--color-silent); }
        .cls-defect.found   { border-color: #00e5ff; background: linear-gradient(180deg, #0a2a4a, #111); box-shadow: 0 0 15px var(--color-defect); }
        .cls-watcher.found  { border-color: #e0b0ff; background: linear-gradient(180deg, #3a0a4a, #111); box-shadow: 0 0 15px var(--color-watcher); }
        .cls-common.found   { border-color: #ffffff; background: linear-gradient(180deg, #333, #111); box-shadow: 0 0 15px #666; }
        .cls-regent.found { border-color: #ff8c00; background: linear-gradient(180deg, #8b4513, #111); box-shadow: 0 0 15px #666; }
        .cls-necro.found { border-color: #c71585; background: linear-gradient(180deg, #800060, #111); box-shadow: 0 0 15px #666; }
        .cls-curse.found { border-color: #8a2be2; background: linear-gradient(180deg, #2e0854, #111); box-shadow: 0 0 15px #4b0082; color: #e0d0ff;}

        .item.missed { border-color: #ff4444 !important; background: #200 !important; }
        .item.missed .answer-text { color: #ff4444; }

        @keyframes gold-pulse {
            0% { box-shadow: 0 0 5px gold; }
            50% { box-shadow: 0 0 25px gold; filter: brightness(1.2); }
            100% { box-shadow: 0 0 5px gold; }
        }
        .limit-max #limitFill { background: gold; animation: gold-pulse 1s infinite; }
    </style>
</head>

    let foundCount = 0;
    let isGameOver = false;
    let answeredIndices = new Set();

    const input = document.getElementById('answerInput');
    const remainingText = document.getElementById('remaining');
    const totalText = document.getElementById('total');
    const listContainer = document.getElementById('answerList');
    const messageEl = document.getElementById('message');
    const giveupBtn = document.getElementById('giveupBtn');
    const hintBtn = document.getElementById('hintBtn');
    const retryBtn = document.getElementById('retryBtn');
    const limitFill = document.getElementById('limitFill');
    const gaugeWrapper = document.getElementById('gaugeWrapper');

    function formatHintForDisplay(hint) { return hint.replace(/・(スターター|コモン|アンコ|レア|エンシェント)/, ""); }

    function getClassByHint(hint) {
        if (hint.includes("アイアンクラッド")) return "cls-ironclad";
        if (hint.includes("サイレント")) return "cls-silent";
        if (hint.includes("ディフェクト")) return "cls-defect";
        if (hint.includes("ウォッチャー")) return "cls-watcher";
        if (hint.includes("リージェント")) return "cls-regent";
        if (hint.includes("ネクロバインダー")) return "cls-necro";
        if (hint.includes("状態異常") || hint.includes("呪い")) return "cls-curse";
        return "cls-common";
    }

    function getRarityClass(hint) {
        if (hint.includes("スターター")) return "hint-starter";
        if (hint.includes("コモン")) return "hint-コモン";
        if (hint.includes("アンコ")) return "hint-アンコ";
        if (hint.includes("レア")) return "hint-レア";
        if (hint.includes("エンシェント")) return "hint-エンシェント";
        return "";
    }

    // コストの表示形式を生成する関数
    function createCostHTML(costString) {
        if (costString.includes('+')) {
            const parts = costString.split('+');
            return `
                <div class="cost-main">${parts[0]}</div>
                <div class="cost-extra"><span>${parts[1]}</span></div>
            `;
        } else {
            return `<div class="cost-main">${costString}</div>`;
        }
    }

    function updateLimitGauge() {
        const percent = Math.floor((foundCount / quizData.length) * 100);
        if(limitFill) limitFill.style.width = percent + "%";
        const percentDisplay = document.getElementById('progressPercent');
        if (percentDisplay) {
            percentDisplay.textContent = (foundCount === quizData.length) ? "VICTORY!" : percent + "%";
        }
        if (foundCount === quizData.length && quizData.length > 0) {
            gaugeWrapper.classList.add('limit-max');
        } else {
            gaugeWrapper.classList.remove('limit-max');
        }
    }

    function init() {
        foundCount = 0;
        isGameOver = false;
        answeredIndices.clear();
        listContainer.innerHTML = '';
        listContainer.classList.remove('show-hints');
        input.disabled = false;
        input.value = '';
        input.placeholder = config.placeholderNormal;
        giveupBtn.style.display = 'inline-block';
        hintBtn.style.display = 'inline-block';
        hintBtn.disabled = false;
        retryBtn.style.display = 'none';
        remainingText.textContent = quizData.length;
        totalText.textContent = quizData.length;
        messageEl.textContent = '';

        quizData.forEach((item, index) => {
            const div = document.createElement('div');
            const colorCls = getClassByHint(item.hint);
            const rarityCls = getRarityClass(item.hint);
            const displayHint = formatHintForDisplay(item.hint);
            div.className = `item ${colorCls}`;
            div.id = 'target-' + index;
            
            div.innerHTML = `
                <div class="cost-container">${createCostHTML(item.cost)}</div>
                <div class="hint-text ${rarityCls}">${displayHint}</div>
                <div class="answer-text">???</div>
            `;
            listContainer.appendChild(div);
        });

        loadProgress();
        updateLimitGauge();
    }

    function loadProgress() {
        const savedData = localStorage.getItem(config.storageKey);
        if (savedData) {
            const savedIndices = JSON.parse(savedData);
            savedIndices.forEach(index => {
                if (index < quizData.length) {
                    answeredIndices.add(index);
                    updateItemDisplay(index, true, false);
                    foundCount++;
                }
            });
            remainingText.textContent = quizData.length - foundCount;
            if (foundCount > 0) showMessage("データをロードしました", "#8c7851");
            if (foundCount === quizData.length) finishGame("ALL CARDS COLLECTED", "gold");
        }
        updateLimitGauge();
    }

    function saveProgress() {
        localStorage.setItem(config.storageKey, JSON.stringify(Array.from(answeredIndices)));
    }

    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !isGameOver) {
            const val = input.value.trim();
            if (val === "") return;
            let targetIndex = quizData.findIndex(item => item.accept.includes(val));

            if (targetIndex !== -1) {
                if (answeredIndices.has(targetIndex)) {
                    showMessage("回答済みです", "#8c7851");
                    document.getElementById('target-' + targetIndex).scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    answeredIndices.add(targetIndex);
                    updateItemDisplay(targetIndex, true, true);
                    foundCount++;
                    remainingText.textContent = quizData.length - foundCount;
                    showMessage("正解！", "#7fff00");
                    saveProgress();
                    updateLimitGauge();
                    if (foundCount === quizData.length) finishGame("VICTORY!", "gold");
                }
            } else {
                showMessage("対象が存在しません", "#ff4444");
            }
            input.value = '';
        }
    });

    function updateItemDisplay(index, isCorrect, shouldScroll) {
        const targetEl = document.getElementById('target-' + index);
        const data = quizData[index];
        const answerEl = targetEl.querySelector('.answer-text');
        answerEl.textContent = data.display;
        
        if (isCorrect) {
            targetEl.classList.add('found');
            if (shouldScroll) {
                targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        } else {
            targetEl.classList.add('missed');
        }
    }

    hintBtn.addEventListener('click', () => {
        if(confirm("カードのコスト(強化前)を表示しますか？")) {
            listContainer.classList.add('show-hints');
            hintBtn.disabled = true;
            showMessage("コスト情報を開示しました", "#ffd700");
        }
    });

    giveupBtn.addEventListener('click', () => { revealAllAnswers(); finishGame("RUN OVER", "#ff4444"); });
    retryBtn.addEventListener('click', () => {
        if(confirm("全ての記録を抹消してリスタートしますか？")) {
            localStorage.removeItem(config.storageKey);
            init();
        }
    });

    function revealAllAnswers() {
        quizData.forEach((item, index) => {
            if (!answeredIndices.has(index)) updateItemDisplay(index, false, false);
        });
    }

    function finishGame(msg, color) {
        isGameOver = true;
        input.disabled = true;
        input.placeholder = config.placeholderGameOver;
        giveupBtn.style.display = 'none';
        hintBtn.style.display = 'none';
        retryBtn.style.display = 'inline-block';
        showMessage(msg, color);
    }

    function showMessage(text, color) {
        messageEl.textContent = text;
        messageEl.style.color = color;
        if (!isGameOver) {
            setTimeout(() => { if (messageEl.textContent === text) messageEl.textContent = ""; }, 1500);
        }
    }

    init();
</script>
